name: urban-form
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.19
  - pip=26.0.1
  - pip:
      # Notebook runtime
      - ipykernel==7.2.0
      - jupyterlab==4.3.4
      - notebook==7.3.2

      # Core numerical and tabular stack
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.11.4
      - pyarrow==24.0.0
      - openpyxl==3.1.5

      # Geospatial and street-network analysis
      - geopandas==1.1.2
      - shapely==2.1.2
      - pyproj==3.7.1
      - pyogrio==0.12.1
      - rasterio==1.4.4
      - osmnx==2.0.7
      - networkx==3.4.2
      - contextily==1.7.1
      - xyzservices==2026.3.0
      - folium==0.20.0
      - branca==0.8.2
      - geopy==2.5.0
      - mapclassify==2.8.1

      # Topological data analysis and graph kernels
      - gudhi==3.11.0
      - grakel==0.1.10
      - persim==0.3.8
      - pot==0.9.6.post1
      - cython==0.29.36
      - future==1.0.0
      - six==1.17.0

      # Machine learning and image processing
      - scikit-learn==1.7.2
      - scikit-image==0.25.2
      - hdbscan==0.8.42

      # Plotting, requests, and utilities
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - pillow==12.1.1
      - requests==2.32.5
      - tqdm==4.67.3
